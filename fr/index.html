  <div class="col">

      <h2 class="headline line">Built to replace every face rating&nbsp;app.</h2>

        <input class="trap" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Rejoindre</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="consent">Un e-mail pour confirmer, un autre le jour du lancement. <a href="https://usedeckard.com/privacy/">Confidentialité</a></p>
    </div>
  </div>
</main>
