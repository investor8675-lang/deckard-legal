    <header class="brand">

        <button type="submit">Iscriviti</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="consent">Un’email per confermare, una al lancio. <a href="https://usedeckard.com/privacy/">Privacy</a></p>
    </div>
  </div>
</main>
