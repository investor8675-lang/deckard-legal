     "and remove the true scan part. that would be perfect"): the name,
     "Coming to iPhone.", the close-up off the edge, "Built to replace every

<main>
  <div class="pic" aria-hidden="true">
    <img class="macro" src="/img/macro.webp" alt="" width="1440" height="2560" fetchpriority="high">
  </div>
  <div class="col">
    <header class="brand">
      <h1 class="wordmark mark">DECKARD</h1>
      <p class="sub">Bald auf dem iPhone.</p>
    </header>
    <div class="ask">
      <h2 class="headline line">Built to replace every face rating&nbsp;app.</h2>
      <p class="count-line" id="waiting" hidden></p>
      <form class="signup" id="signup" novalidate>
        <label class="sr" for="email">E-Mail</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Deine E-Mail" required>
        <input class="trap" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Eintragen</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="consent">Eine E-Mail zur Bestätigung, eine zum Launch. <a href="https://usedeckard.com/privacy/">Datenschutz</a></p>
    </div>
  </div>
</main>

<footer>
  <div class="in">
    <div class="left">

    </nav>
  </div>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
